        ${regularSeasons(e).length
          ? `<button class="btn sm" data-markall="${allRegularWatched(e) ? "0" : "1"}">${
               t(allRegularWatched(e) ? "取消所有正季" : "所有正季标记已看")}</button>`
          : ""}
      </div>
      ${isDraft() ? "" : `<button class="btn sm danger" data-del>${t("从书架移除")}</button>`}
    </div>
    ${isDraft() ? "" : `<div class="tiny faint" style="margin-top:14px">
      ${t("添加于 {0} · 更新于 {1}", ymd(e.addedAt), ymd(e.updatedAt))}
    </div>`}
  </div>`;
}

async function openSheet(id, previewEntry = null) {
  draft = previewEntry;
  openId = id;
  const e = current();
  if (!e) { openId = null; return; }
  $("#sheet").innerHTML = sheetHTML(e);
  $("#scrim").classList.add("on");
  $("#scrim").scrollTop = 0;
  document.body.style.overflow = "hidden";

  // Lazily fill in genres / runtime / season list the first time an entry is opened.
  if (!e.detailLoaded && KEY) {
    try {
      await ensureDetail(e);
      if (openId === id) { $("#sheet").innerHTML = sheetHTML(current() || e); renderLibrary(); }
    } catch (err) { console.warn("detail fetch failed", err); }
  }
  if (KEY) {
    try {
      await ensureExtras(e);
      if (openId === id) refreshSheet();
    } catch (err) { console.warn("overview/cast fetch failed", err); }
  }
}

function closeSheet() {
  const wasId = openId;          // capture before clearing, the deck needs it below
  openId = null;
  draft = null;
  $("#scrim").classList.remove("on");
  $("#sheet").innerHTML = "";
  document.body.style.overflow = "";
  renderLibrary();
  if (page === "search" && feed.hits.length) renderFeed();   // refresh 已在书架 badges
  if (page === "deck") {
    // if the sheet added it to the library, that card has been judged
    const c = deck.cards[deck.i];
    if (c && c.id === wasId && find(wasId)) {
      deck.history.push({ id: wasId, action: find(wasId).status === "done" ? "yes" : "want" });
      deck.i++;
      if (deck.cards.length - deck.i <= 3) loadDeck(true);
    }
    renderDeck();
  }
}

function refreshSheet() {
  const e = current();
  if (e) $("#sheet").innerHTML = sheetHTML(e);
}

/* ---------------- episodes ---------------- */

async function loadEpisodes(e, n, host) {
  try {
    const eps = await fetchSeason(e.tmdbId, n);
    const seen = new Set(e.progress[n] || []);
    host.innerHTML = eps.map(ep => `
      <label class="ep ${seen.has(ep.episode_number) ? "seen" : ""}" data-ep="${ep.episode_number}">
        <input type="checkbox" ${seen.has(ep.episode_number) ? "checked" : ""}>
        <span>
          <span class="en">${ep.episode_number}. ${esc(ep.name || t("第 {0} 集", ep.episode_number))}</span>
          ${ep.air_date ? `<span class="ed">${ep.air_date}</span>` : ""}
        </span>
      </label>`).join("")
      + `<div class="ep-tools">
           <button class="btn sm" data-allseason="${n}">${t("全部标记已看")}</button>
           <button class="btn sm" data-noneseason="${n}">${t("全部取消")}</button>
         </div>`;
  } catch (err) {
    host.innerHTML = `<div class="tiny faint" style="padding:10px 4px">${t("加载失败：{0}", esc(err.message))}</div>`;
  }
}

/** Flip an episode's watched state and keep status/dates coherent. */
function toggleEp(e, season, ep, on) {
  const list = new Set(e.progress[season] || []);
  on ? list.add(ep) : list.delete(ep);
  if (list.size) e.progress[season] = [...list].sort((a, b) => a - b);
  else delete e.progress[season];

  if (on && e.status === "plan") {
    e.status = "watching";
    if (!e.startedAt) e.startedAt = ymd(Date.now());
  }
  const tot = totalEps(e);
  if (tot && watchedEps(e) >= tot && e.status === "watching") {
    e.status = "done";
    if (!e.finishedAt) e.finishedAt = ymd(Date.now());
  }
  touch(e);
}

function setSeasonAll(e, n, on) {
  const meta = (e.seasonsMeta || []).find(s => s.n === n);
  if (!meta) return;
  if (on) e.progress[n] = Array.from({ length: meta.count }, (_, i) => i + 1);
  else delete e.progress[n];

  const tot = totalEps(e);
  if (tot && watchedEps(e) >= tot && e.status !== "done") {
    e.status = "done";
    if (!e.finishedAt) e.finishedAt = ymd(Date.now());
  } else if (watchedEps(e) > 0 && e.status === "plan") {
    e.status = "watching";
    if (!e.startedAt) e.startedAt = ymd(Date.now());
  }
  touch(e);
}

/* ============================================================
   STATS
   ============================================================ */

function renderStats() {
  const es = DB.entries;
  const host = $("#statsBody");
  if (!es.length) {
    host.innerHTML = `<div class="empty"><div class="big">📊</div><div class="tiny">${t("书架为空，先记几部再来看")}</div></div>`;
    return;
  }

  const done   = es.filter(e => e.status === "done");
  const movies = es.filter(e => e.mediaType === "movie");
  const shows  = es.filter(e => e.mediaType === "tv");
  const favs   = es.filter(e => e.favorite);

  // rough watch time: movies use runtime, shows use per-episode runtime x watched episodes
  let minutes = 0;
  for (const e of es) {
    if (e.mediaType === "movie") {
      if (e.status === "done") minutes += (e.runtime || 0) * (1 + (e.rewatch || 0));
    } else {
      minutes += (e.runtime || 42) * watchedEps(e);
    }
  }
  const hours = Math.round(minutes / 60);
  const eps   = shows.reduce((a, e) => a + watchedEps(e), 0);

  // release decades — the shelf's taste in eras, distinct from 每年看完 above
  const byDecade = {};
  for (const e of es) { const d = decadeOf(e); if (d) byDecade[d] = (byDecade[d] || 0) + 1; }
  const decades = Object.keys(byDecade).sort();
  const maxDec  = Math.max(1, ...Object.values(byDecade));

  const stats = [
    [es.length, t("总条目")],
    [done.length, t("已看完")],
    [movies.length, t("电影")],
    [shows.length, t("剧集")],
    [eps.toLocaleString(), t("看过的集数")],
    [hours ? hours.toLocaleString() : "—", t("累计小时")],
    [favs.length, t("收藏")],
  ];

  // finished-per-year histogram
  const byYear = {};
  for (const e of es) {
    const y = (e.finishedAt || "").slice(0, 4);
    if (y) byYear[y] = (byYear[y] || 0) + 1;
  }
  const years = Object.keys(byYear).sort();
  const maxY  = Math.max(1, ...Object.values(byYear));

  // TMDb score distribution, bucketed by whole point
  const scored = es.filter(e => e.tmdbScore > 0);
  const dist = Array(10).fill(0);
  for (const e of scored) dist[Math.min(9, Math.max(0, Math.ceil(e.tmdbScore) - 1))]++;
  const maxD = Math.max(1, ...dist);
  const avgScore = scored.length
    ? scored.reduce((a, e) => a + e.tmdbScore, 0) / scored.length : 0;

  const genreCount = {};
  for (const e of es) for (const g of (e.genres || [])) genreCount[g] = (genreCount[g] || 0) + 1;
  const topGenres = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 12);

  const cols = gridCols(host);
  const recent = es.filter(e => e.finishedAt)
    .sort((a, b) => b.finishedAt.localeCompare(a.finishedAt))
    .slice(0, 3 * cols);                // three full rows, never a ragged tail

  host.innerHTML = `
    <div class="stat-grid">
      ${stats.map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}
    </div>

    ${years.length ? `
    <div class="blk" style="margin-top:0">
      <div class="sec-title">${t("每年看完")}</div>
      <div class="chart">
        ${years.map(y => `
          <div class="col" title="${t("{0}：{1} 部", y, byYear[y])}">
            <span class="cnt">${byYear[y]}</span>
            <div class="bar2" style="height:${byYear[y] / maxY * 100}%"></div>
            <span class="lab">${y}</span>
          </div>`).join("")}
      </div>
    </div>` : ""}

    ${scored.length ? `
    <div class="blk">
      <div class="sec-title">${t("书架的 TMDb 评分分布 · 均分 {0}", avgScore.toFixed(2))}</div>
      <div class="chart">
        ${dist.map((c, i) => `
          <div class="col" title="${t("{0}–{1} 分：{2} 部", i, i + 1, c)}">
            <span class="cnt">${c || ""}</span>
            <div class="bar2" style="height:${c / maxD * 100}%;${c ? "" : "opacity:.2"}"></div>
            <span class="lab">${i + 1}</span>
          </div>`).join("")}
      </div>
    </div>` : ""}

    ${decades.length > 1 ? `
    <div class="blk">
      <div class="sec-title">${t("看的片子出自哪些年代")}</div>
      <div class="chart">
        ${decades.map(d => `
          <div class="col" title="${t("{0} 年代：{1} 部", d, byDecade[d])}">
            <span class="cnt">${byDecade[d]}</span>
            <div class="bar2" style="height:${byDecade[d] / maxDec * 100}%"></div>
            <span class="lab">${d.slice(2)}s</span>
          </div>`).join("")}
      </div>
    </div>` : ""}

    ${topGenres.length ? `
    <div class="blk">
      <div class="sec-title">${t("常看类型")}</div>
      <div class="genres">${topGenres.map(([g, c]) =>
        `<span>${esc(g)} <b style="color:var(--accent)">${c}</b></span>`).join("")}</div>
    </div>` : ""}

    ${recent.length ? `
    <div class="blk">
      <div class="sec-title">${t("最近看完")}</div>
      <div class="grid">${recent.map(e => posterCard(e, { noBadge: true })).join("")}</div>
    </div>` : ""}
  `;

  // The first paint had no grid to measure, so `cols` was an estimate. Now that one
  // exists, redo the slice if the estimate was off — once, guarded against looping.
  const grid = host.querySelector(".grid");
  if (grid && !host.dataset.recheck) {
    const real = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
    if (real && real !== cols) {
      host.dataset.recheck = "1";
      renderStats();
      delete host.dataset.recheck;
    }
  }
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */

function exportJSON() {
  const payload = JSON.stringify({ ...DB, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `shelf-${ymd(Date.now())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(t("已导出 {0} 条", DB.entries.length));
}

/** Three-way merge of a remote/imported payload into DB.
 *  Per-entry last-write-wins on updatedAt; tombstones make deletions stick. */
function mergeRemote(remote) {
  let added = 0, updated = 0, removed = 0;

  for (const [id, ts] of Object.entries((remote && remote.skipped) || {})) {
    if (!DB.skipped[id] || DB.skipped[id] < ts) DB.skipped[id] = ts;
  }
  const rDel = (remote && remote.deleted) || {};
  for (const [id, ts] of Object.entries(rDel)) {
    if (!DB.deleted[id] || DB.deleted[id] < ts) DB.deleted[id] = ts;
    const cur = find(id);
    if (cur && (cur.updatedAt || 0) <= ts && dropLocal(id)) removed++;
  }

  for (const inc of (remote && remote.entries) || []) {
    if (!inc || !inc.id) continue;
    const tomb = DB.deleted[inc.id];
    if (tomb && tomb >= (inc.updatedAt || 0)) continue;   // deleted here, and the deletion is newer
    if (tomb) delete DB.deleted[inc.id];                  // resurrected by a newer edit elsewhere
    const cur = find(inc.id);
    if (!cur) { DB.entries.push(blankEntry(inc)); added++; }
    else if ((inc.updatedAt || 0) > (cur.updatedAt || 0)) { Object.assign(cur, inc); updated++; }
  }

  normalizeAll();
  return { added, updated, removed };
}

/** Tombstones only need to outlive the slowest device. */
function pruneTombstones() {
  const cutoff = Date.now() - 180 * 864e5;
  for (const [id, ts] of Object.entries(DB.deleted)) if (ts < cutoff) delete DB.deleted[id];
}

function importJSON(text) {
  let p;
  try { p = JSON.parse(text); }
  catch { toast(t("不是合法的 JSON 文件")); return; }
  if (!p || !Array.isArray(p.entries)) { toast(t("文件里没有 entries 字段")); return; }

  const r = mergeRemote(p);
  save();
  renderLibrary();
  toast(t("导入完成 · 新增 {0}，更新 {1}", r.added, r.updated) + (r.removed ? t("，删除 {0}", r.removed) : ""));
}

/* ============================================================
   GITHUB GIST SYNC
   A private gist holds one shelf.json. Every device pulls, merges,
   then pushes — so the gist is a meeting point, not a master copy.
   ============================================================ */

const GIST_FILE = "shelf.json";

function payloadString() {
  return JSON.stringify({
    version: VERSION,
    entries: DB.entries,
    deleted: DB.deleted,
    skipped: DB.skipped,
    savedAt: new Date().toISOString(),
  }, null, 1);
}

async function ghApi(path, opts = {}) {
  if (!GH.token) throw new Error("NO_TOKEN");
  const res = await fetch("https://api.github.com" + path, {
    method: opts.method || "GET",
    body: opts.body,
    headers: {
      Authorization: "Bearer " + GH.token,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
    },
  });
  if (res.status === 401) throw new Error("BAD_TOKEN");
  if (res.status === 403) throw new Error("NO_SCOPE");
  if (res.status === 404) throw new Error("NOT_FOUND");
  if (!res.ok) throw new Error("GitHub " + res.status);
  return res.json();
}

async function ghCreateGist() {
  const d = await ghApi("/gists", {
    method: "POST",
    body: JSON.stringify({
      description: t("片柜 Shelf — 影视记录数据（由网页自动同步，请勿手动编辑）"),
      public: false,
      files: { [GIST_FILE]: { content: payloadString() } },
    }),
  });
  GH.gist = d.id;
  saveGH();
  return d.id;
}

async function ghPull() {
  const d = await ghApi("/gists/" + GH.gist);
  const f = d.files && d.files[GIST_FILE];
  if (!f) throw new Error("NO_FILE");
  // gists over 1 MB come back truncated; the raw blob is public-by-URL but unguessable
  const text = f.truncated && f.raw_url ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(text);
}

async function ghPush() {
  await ghApi("/gists/" + GH.gist, {
    method: "PATCH",
    body: JSON.stringify({ files: { [GIST_FILE]: { content: payloadString() } } }),
  });
}

function syncErr(err) {
  return ({
    NO_TOKEN:  t("还没填 GitHub Token"),
    BAD_TOKEN: t("Token 无效或已过期"),
    NO_SCOPE:  t("Token 缺少 gist 权限"),
    NOT_FOUND: t("找不到这个 Gist（ID 错了，或 Token 不是同一个账号的）"),
    NO_FILE:   t("Gist 里没有 {0}", GIST_FILE),
  })[err.message] || t("同步失败：{0}", err.message);
}

let syncing = false, syncTimer = null, lastAutoPull = 0;

function setSyncUI(state, note) {
  const b = $("#syncBtn");
  b.hidden = !(GH.token && GH.gist);
  b.classList.toggle("spin", state === "syncing");
  b.classList.toggle("ok",   state === "ok");
  b.classList.toggle("err",  state === "err");

  const m = $("#ghMsg");
  if (!m) return;
  if (state === "syncing") { m.innerHTML = `<span class="spinner"></span> ${t("同步中…")}`; m.style.color = "var(--dim)"; }
  else if (state === "ok") {
    m.textContent = `✓ ${note || t("已同步")} · ${new Date(GH.lastSync).toLocaleString(localeTag())}`;
    m.style.color = "var(--green)";
  } else if (state === "err") { m.textContent = "✕ " + note; m.style.color = "var(--red)"; }
  else if (GH.lastSync) {
    m.textContent = t("上次同步 {0}", new Date(GH.lastSync).toLocaleString(localeTag()));
    m.style.color = "var(--faint)";
  } else { m.textContent = ""; }
}

async function syncNow(opts = {}) {
  if (!GH.token || !GH.gist) {
    if (!opts.silent) toast(t("先填好 Token 和 Gist ID"));
    return;
  }
  if (syncing) return;
  syncing = true;
  clearTimeout(syncTimer);
  setSyncUI("syncing");
  try {
    let r = { added: 0, updated: 0, removed: 0 };
    try {
      r = mergeRemote(await ghPull());
    } catch (err) {
      if (err.message !== "NO_FILE") throw err;   // empty gist is fine: we seed it below
    }
    pruneTombstones();
    await ghPush();

    GH.lastSync = Date.now();
    saveGH();
    try { localStorage.setItem(LS_DATA, JSON.stringify(DB)); } catch (e) {}

    const changed = r.added + r.updated + r.removed;
    setSyncUI("ok", changed ? t("拉回 {0} 新增 / {1} 更新 / {2} 删除", r.added, r.updated, r.removed) : t("已是最新"));
    renderLibrary();
    if (page === "stats") renderStats();
    if (!opts.silent) toast(changed ? t("同步完成 · 合并了 {0} 处改动", changed) : t("同步完成 · 已是最新"));
    else if (changed) toast(t("已从云端合并 {0} 处改动", changed));
  } catch (err) {
    setSyncUI("err", syncErr(err));
    if (!opts.silent) toast(syncErr(err));
    console.warn("sync failed", err);
  } finally {
    syncing = false;
  }
}

function scheduleSync() {
  if (!GH.auto || !GH.token || !GH.gist || syncing) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow({ silent: true }), 4000);
}

/* ============================================================
   NAV + EVENTS
   ============================================================ */

function go(p) {
  if (openId) closeSheet();
  page = p;
  $$(".page").forEach(s => s.classList.toggle("on", s.id === "page-" + p));
  $$("#tabs .tab").forEach(t =>
    t.setAttribute("aria-current", t.dataset.page === p ? "page" : "false"));
  if (p === "stats") renderStats();
  if (p === "deck") { deck.cards.length ? renderDeck() : loadDeck(); }
  if (p === "library") renderLibrary();
  if (p === "search") {
    if (!$("#tmBody").innerHTML.trim()) {
      const q = $("#tmQ").value.trim();
      q ? showSearch(q) : showBrowse();
    }
    setTimeout(() => $("#tmQ").focus(), 40);
  }
  window.scrollTo(0, 0);
}

function applyTheme() {
  document.documentElement.dataset.theme = PREFS.theme;
}

let searchDebounce;

function wire() {
  /* --- tabs / theme --- */
  $("#tabs").addEventListener("click", ev => {
    const t = ev.target.closest(".tab");
    if (t) go(t.dataset.page);
  });
  $("#themeBtn").addEventListener("click", () => {
    PREFS.theme = PREFS.theme === "dark" ? "light" : "dark";
    applyTheme(); savePrefs();
  });

  /* --- library controls --- */
  let libQTimer;
  $("#libQ").addEventListener("input", () => {
    clearTimeout(libQTimer);
    libQTimer = setTimeout(() => { resetLibPaging(); renderLibrary(); }, 160);
  });
  $("#libSort").addEventListener("change", ev => {
    PREFS.sort = ev.target.value; savePrefs(); resetLibPaging(); renderLibrary();
  });
  $("#vGrid").addEventListener("click", () => setView("grid"));
  $("#vList").addEventListener("click", () => setView("list"));

  $("#fType").addEventListener("click", ev => {
    const c = ev.target.closest("[data-ftype]");
    if (!c || c.dataset.ftype === PREFS.fType) return;
    // This row is the primary filter: switching it starts a fresh look at the
    // shelf, so the secondary rows go back to 所有.
    PREFS.fType = c.dataset.ftype;
    Object.assign(PREFS, { fStatus: "all", fGenre: "all", fDecade: "all" });
    savePrefs(); resetLibPaging(); renderLibrary();
  });
  $("#fStatus").addEventListener("click", ev => {
    const c = ev.target.closest("[data-fstatus]");
    if (c) { PREFS.fStatus = c.dataset.fstatus; savePrefs(); resetLibPaging(); renderLibrary(); }
  });
  $("#fMore").addEventListener("change", ev => {
    const map = { selGenre: "fGenre", selDecade: "fDecade" };
    const key = map[ev.target.id];
    if (!key) return;
    PREFS[key] = ev.target.value; savePrefs(); resetLibPaging(); renderLibrary();
  });
  $("#libCount").addEventListener("click", ev => {
    if (!ev.target.closest("#clearFilters")) return;
    Object.assign(PREFS, { fType: "all", fStatus: "all", fGenre: "all", fDecade: "all" });
    $("#libQ").value = "";
    savePrefs(); resetLibPaging(); renderLibrary();
  });
  $("#libBody").addEventListener("click", ev => {
    if (ev.target.closest("[data-libmore]")) { libPages++; renderLibrary(); return; }
    if (ev.target.closest("[data-liball]"))  { libShowAll = true; renderLibrary(); return; }
    const c = ev.target.closest("[data-open]");
    if (c) openSheet(c.dataset.open);
  });
  $("#deckBody").addEventListener("click", ev => {
    if (ev.target.closest("[data-deckmore]")) { loadDeck(); return; }
    const b = ev.target.closest("[data-swipe]");
    if (!b) return;
    const d = b.dataset.swipe;
    d === "undo" ? deckUndo() : deckAct(d);
  });

  $("#statsBody").addEventListener("click", ev => {
    const c = ev.target.closest("[data-open]");
    if (c) openSheet(c.dataset.open);
  });

  /* --- TMDb search --- */
  $("#tmQ").addEventListener("input", ev => {
    clearTimeout(searchDebounce);
    const v = ev.target.value.trim();
    searchDebounce = setTimeout(() => v ? showSearch(v) : showBrowse(), 380);
  });
  $("#tmLang").addEventListener("change", ev => setLanguage(ev.target.value));
  $("#browseBar").addEventListener("click", ev => {
    const c = ev.target.closest("[data-browse]");
    if (c) showBrowse(c.dataset.browse);
  });

  $("#tmBody").addEventListener("click", ev => {
    if (ev.target.closest("#moreBtn")) {
      feed.rows += FEED_ROWS;
      const need = feed.rows * gridCols($("#tmBody"));
      if (need > feed.hits.length && feed.page < feed.totalPages) { feed.page++; loadFeed(); }
      else renderFeed();
      return;
    }

    const pc = ev.target.closest("[data-person]");
    if (pc) {
      const p = feed.people.find(x => String(x.id) === pc.dataset.person);
      if (p) showPerson({ id: p.id, name: p.name, photo: p.profile_path });
      return;
    }
    if (ev.target.closest("[data-backsearch]")) {
      feed.q ? showSearch(feed.q) : showBrowse();
      return;
    }
    const c = ev.target.closest("[data-add]");
    if (!c) return;
    const hits = $("#tmBody")._hits || [];
    const hit  = hits.find(h => h.id === c.dataset.add);
    if (!hit) return;
    const existing = find(hit.id);
    if (existing) { openSheet(existing.id); return; }
    openSheet(hit.id, blankEntry(hit));   // preview only — committed on first edit
  });

  /* --- detail sheet --- */
  $("#scrim").addEventListener("click", ev => {
    if (ev.target === $("#scrim")) closeSheet();
  });

  $("#sheet").addEventListener("click", async ev => {
    let e = current();
    if (!e) return;

    if (ev.target.closest("[data-close]")) { closeSheet(); return; }

    const cast = ev.target.closest("[data-cast]");
    if (cast) {
      const p = { id: +cast.dataset.cast, name: cast.dataset.castname,
                  photo: cast.dataset.castphoto || null };
      closeSheet();
      go("search");
      showPerson(p);
      return;
    }

    // Opening a search result only previews it; acting on it is what adds it.
    if (ev.target.closest("[data-status],[data-fav],[data-markall],[data-allseason],[data-noneseason]")) {
      if (commitDraft()) e = current();
    }

    const st = ev.target.closest("[data-status]");
    if (st) {
      e.status = st.dataset.status;
      if (e.status === "watching" && !e.startedAt) e.startedAt = ymd(Date.now());
      if (e.status === "done" && !e.finishedAt) e.finishedAt = ymd(Date.now());
      touch(e); refreshSheet(); return;
    }

    if (ev.target.closest("[data-fav]")) {
      e.favorite = !e.favorite; touch(e); refreshSheet(); return;
    }

    if (ev.target.closest("[data-refresh]")) {
      const btn = ev.target.closest("[data-refresh]");
      btn.disabled = true; btn.textContent = t("刷新中…");
      try {
        seasonCache.clear();
        await ensureDetail(e, true);
        refreshSheet();
        toast(t("元数据已更新"));
      } catch (err) {
        toast(err.message === "NO_KEY" ? t("先去设置里填 API key") : t("刷新失败：{0}", err.message));
        btn.disabled = false; btn.textContent = t("刷新元数据");
      }
      return;
    }

    if (ev.target.closest("[data-del]")) {
      if (!confirm(t("确定把《{0}》从书架移除？此操作不可撤销。", e.title))) return;
      removeEntry(e.id);
      closeSheet();
      toast(t("已移除"));
      return;
    }

    const ma = ev.target.closest("[data-markall]");
    if (ma) {
      const on = ma.dataset.markall === "1";
      const open = [...$$("details.season", $("#sheet"))].filter(d => d.open).map(d => d.dataset.season);
      for (const s of regularSeasons(e)) setSeasonAll(e, s.n, on);
      // Undo the status/date that marking just set — but only if the finish date is
      // today's, so a real date typed in earlier is never thrown away.
      if (!on && !watchedEps(e) && e.status === "done" && e.finishedAt === ymd(Date.now())) {
        e.status = "plan";
        e.finishedAt = "";
        touch(e);
      }
      refreshSheet(); reopenSeasons(e, open);
      const n = regularSeasons(e).reduce((a, s) => a + s.count, 0);
      toast(on ? t("已标记 {0} 季 · {1} 集", regularSeasons(e).length, n) : t("已取消所有正季"));
      return;
    }

    const all = ev.target.closest("[data-allseason]");
    if (all) {
      setSeasonAll(e, Number(all.dataset.allseason), true);
      const open = [...$$("details.season", $("#sheet"))].filter(d => d.open).map(d => d.dataset.season);
      refreshSheet(); reopenSeasons(e, open); return;
    }
    const none = ev.target.closest("[data-noneseason]");
    if (none) {
      setSeasonAll(e, Number(none.dataset.noneseason), false);
      const open = [...$$("details.season", $("#sheet"))].filter(d => d.open).map(d => d.dataset.season);
      refreshSheet(); reopenSeasons(e, open); return;
    }
  });

  // episode checkboxes
  $("#sheet").addEventListener("change", ev => {
    let e = current();
    if (!e) return;
    if (commitDraft()) e = current();

    if (ev.target.matches('.ep input[type="checkbox"]')) {
      const lab = ev.target.closest(".ep");
      const box = ev.target.closest("[data-eps]");
      toggleEp(e, Number(box.dataset.eps), Number(lab.dataset.ep), ev.target.checked);
      lab.classList.toggle("seen", ev.target.checked);
      // update just this season's header counters without collapsing anything
      const det = box.closest("details.season");
      const meta = (e.seasonsMeta || []).find(s => s.n === Number(box.dataset.eps));
      const seen = (e.progress[box.dataset.eps] || []).length;
      if (det && meta) {
        $(".scount", det).textContent = `${seen}/${meta.count}`;
        $(".bar i", det).style.width = (meta.count ? seen / meta.count * 100 : 0) + "%";
      }
      return;
    }

    if (ev.target.id === "dStart")  { e.startedAt  = ev.target.value; touch(e); }
    if (ev.target.id === "dFin")    { e.finishedAt = ev.target.value; touch(e); }
    if (ev.target.id === "dRew")    { e.rewatch    = Math.max(0, Number(ev.target.value) || 0); touch(e); }
  });

  $("#sheet").addEventListener("input", ev => {
    if (ev.target.id !== "dNotes") return;
    commitDraft();
    const e = current();
    if (e) { e.notes = ev.target.value; touch(e); }
  });

  // lazily load a season's episodes when it is first expanded
  $("#sheet").addEventListener("toggle", ev => {
    const det = ev.target;
    if (!det.matches("details.season") || !det.open) return;
    const e = current();
    const host = $("[data-eps]", det);
    if (!e || !host || host.dataset.loaded) return;
    host.dataset.loaded = "1";
    host.innerHTML = `<div class="tiny faint" style="padding:10px 4px"><span class="spinner"></span> ${t("加载中…")}</div>`;
    loadEpisodes(e, Number(det.dataset.season), host);
  }, true);

  /* --- settings --- */
  $("#keySave").addEventListener("click", async () => {
    const v = $("#keyIn").value.trim();
    const msg = $("#keyMsg");
    if (!v) { msg.textContent = t("先粘贴一个 key"); msg.style.color = "var(--red)"; return; }
    msg.innerHTML = `<span class="spinner"></span> 测试中…`;
    msg.style.color = "var(--dim)";
    const prev = KEY;
    KEY = v;
    try {
      await tmdb("/configuration");
      localStorage.setItem(LS_KEY, v);
      msg.textContent = t("✓ 有效，已保存到本机");
      msg.style.color = "var(--green)";
      renderLibrary();
    } catch (err) {
      KEY = prev;
      msg.textContent = err.message === "BAD_KEY" ? t("✕ key 无效") : "✕ " + err.message;
      msg.style.color = "var(--red)";
    }
  });
  $("#keyShow").addEventListener("click", () => {
    const i = $("#keyIn");
    i.type = i.type === "password" ? "text" : "password";
    $("#keyShow").textContent = t(i.type === "password" ? "显示" : "隐藏");
  });
  $("#setRegion").addEventListener("change", ev => {
    PREFS.region = ev.target.value; savePrefs();
    const cat = BROWSE.find(b => b.key === feed.key);
    if (feed.mode === "browse" && cat && cat.region) loadFeed(true);
    toast(t(ev.target.value ? "院线地区已切换" : "已取消地区限定"));
  });
  $("#setLang").addEventListener("change", ev => setLanguage(ev.target.value));

  /** "看完" should mean every regular season is done. Imported data (and shows that
   *  gained seasons since) can drift out of that. */
  function staleDone() {
    return DB.entries.filter(e => {
      if (e.mediaType !== "tv" || e.status !== "done") return false;
      const tot = totalEps(e);
      return tot > 0 && watchedEps(e) < tot;
    });
  }

  $("#fixStatus").addEventListener("click", () => {
    const hits = staleDone();
    const m = $("#fixMsg");
    if (!hits.length) {
      m.textContent = t("✓ 没有需要校正的条目"); m.style.color = "var(--green)";
      return;
    }
    const list = hits.slice(0, 8)
      .map(e => `${e.title}（${watchedEps(e)}/${totalEps(e)} ${t("集")}）`).join("、");
    if (!confirm(t("有 {0} 部剧集标着「看完」但正季没看完，改成「在看」？", hits.length) + "\n\n"
                 + list + (hits.length > 8 ? t(" …等 {0} 部", hits.length) : ""))) return;
    for (const e of hits) { e.status = "watching"; e.updatedAt = Date.now(); }
    save(); renderLibrary();
    m.innerHTML = t("✓ 已把 {0} 部改成「在看」", hits.length); m.style.color = "var(--green)";
    toast(t("已校正 {0} 部剧集", hits.length));
  });

  $("#setBirth").addEventListener("change", ev => {
    PREFS.birthYear = ev.target.value.trim(); savePrefs();
    deck.cards = []; toast(t(PREFS.birthYear ? "已记录，推荐会参考你的成长年代" : "已取消"));
  });
  $("#setHomeLang").addEventListener("change", ev => {
    PREFS.homeLang = ev.target.value; savePrefs();
    deck.cards = []; toast(t(ev.target.value ? "已记录母语偏好" : "已取消"));
  });
  $("#resetSkipped").addEventListener("click", () => {
    const n = Object.keys(DB.skipped).length;
    if (!n) { $("#skipMsg").textContent = t("本来就是空的"); return; }
    if (!confirm(t("清空 {0} 条「没看过」记录？它们会重新出现在推荐里。", n))) return;
    DB.skipped = {}; save(); deck.cards = [];
    $("#skipMsg").textContent = t("已清空 {0} 条", n);
  });

  $("#expBtn").addEventListener("click", exportJSON);
  $("#impBtn").addEventListener("click", () => $("#impFile").click());
  $("#impFile").addEventListener("change", ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    r.readAsText(f);
    ev.target.value = "";
  });
  $("#wipeBtn").addEventListener("click", () => {
    if (!confirm(t("确定清空全部 {0} 条记录？强烈建议先导出备份。", DB.entries.length))) return;
    if (!confirm(t("再确认一次：这会永久删除所有记录。"))) return;
    const now = Date.now();
    for (const e of DB.entries) DB.deleted[e.id] = now;   // so sync doesn't resurrect them
    DB.entries = [];
    save(); renderLibrary(); renderStats();
    toast(t("书架已清空"));
  });

  /* --- gist sync --- */
  function readGHFields() {
    GH.token = $("#ghToken").value.trim();
    GH.gist  = $("#ghGist").value.trim().replace(/^.*\/([0-9a-f]+)\/?$/i, "$1");  // accept a full gist URL
    GH.auto  = $("#ghAuto").checked;
    $("#ghGist").value = GH.gist;
    saveGH();
  }

  $("#ghSave").addEventListener("click", () => {
    readGHFields();
    setSyncUI("");
    toast(t(GH.token && GH.gist ? "已保存，可以同步了" : "已保存"));
  });

  $("#ghNew").addEventListener("click", async () => {
    readGHFields();
    if (!GH.token) { setSyncUI("err", t("先填 Token")); return; }
    if (GH.gist && !confirm(t("已经填了 Gist ID，确定再新建一个？现有的那个不会被删除，但这台设备会改用新的。"))) return;
    setSyncUI("syncing");
    try {
      const id = await ghCreateGist();
      $("#ghGist").value = id;
      GH.lastSync = Date.now(); saveGH();
      setSyncUI("ok", t("已新建私密 Gist {0}", id));
      toast(t("Gist 已创建 · 把这个 ID 填到其他设备上"));
    } catch (err) { setSyncUI("err", syncErr(err)); }
  });

  $("#ghSync").addEventListener("click", () => { readGHFields(); syncNow(); });
  $("#syncBtn").addEventListener("click", () => syncNow());
  $("#ghAuto").addEventListener("change", () => { GH.auto = $("#ghAuto").checked; saveGH(); });

  // coming back to the tab is the cheapest moment to pick up another device's edits
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (!GH.auto || !GH.token || !GH.gist) return;
    if (Date.now() - lastAutoPull < 30000) return;
    lastAutoPull = Date.now();
    syncNow({ silent: true });
  });

  // A "row" is only meaningful given a column count, and that follows the width.
  // ResizeObserver catches every cause (window resize, rotation, pane resize);
  // re-rendering only changes height, and the guard below ignores that anyway.
  const watched = [
    [$("#libBody"), () => { if (page === "library") renderLibrary(); }],
    [$("#tmBody"),  () => { if (page === "search" && feed.hits.length) renderFeed(); }],
    [$("#statsBody"), () => { if (page === "stats") renderStats(); }],
  ];
  const lastCols = new Map();
  const recheck = () => {
    for (const [host, redraw] of watched) {
      const n = gridCols(host);
      if (!n || lastCols.get(host) === n) continue;   // re-rendering changes height, not columns
      lastCols.set(host, n);
      redraw();
    }
  };
  if (typeof ResizeObserver === "function") {
    const ro = new ResizeObserver(recheck);
    for (const [host] of watched) ro.observe(host);
  }
  // ResizeObserver is the precise one, but it is tied to the rendering loop; the
  // window events cover the cases where frames aren't being produced.
  let colTimer;
  const nudge = () => { clearTimeout(colTimer); colTimer = setTimeout(recheck, 150); };
  addEventListener("resize", nudge);
  addEventListener("orientationchange", nudge);

  /* --- keyboard --- */
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && openId) { closeSheet(); return; }
    if (ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      ev.preventDefault();
      (page === "search" ? $("#tmQ") : $("#libQ")).focus();
    }
  });
}

/** One switch drives both the interface and what TMDb is asked for, so every
 *  cached response in the old language has to go. */
function setLanguage(lang) {
  if (lang === PREFS.lang) return;
  PREFS.lang = lang;
  savePrefs();
  $("#tmLang").value = lang;
  $("#setLang").value = lang;

  extras.clear();          // overviews + cast
  seasonCache.clear();     // episode lists
  genreIds = null;         // genre names
  feed.hits = []; feed.people = [];
  deck.cards = []; deck.i = 0;

  applyStaticI18n();
  renderLibrary();
  if (page === "stats") renderStats();
  if (page === "deck") loadDeck();
  if (page === "search") (feed.mode === "search" ? showSearch(feed.q) : showBrowse());
  const v = $("#verLine");
  if (v) v.textContent = t("本地共 {0} 条记录 · 数据格式 v{1}", DB.entries.length, VERSION);
  toast(t("已切换语言"));
}

function setView(v) {
  PREFS.view = v; savePrefs(); resetLibPaging();
  $("#vGrid").setAttribute("aria-pressed", String(v === "grid"));
  $("#vList").setAttribute("aria-pressed", String(v === "list"));
  renderLibrary();
}

function reopenSeasons(e, seasons) {
  for (const n of seasons) {
    const det = $(`details.season[data-season="${n}"]`, $("#sheet"));
    if (det) det.open = true;   // the toggle handler reloads episodes
  }
}

/* ============================================================
   INIT
   ============================================================ */

function init() {
  load();
  applyTheme();
  applyStaticI18n();      // injects the prose blocks, #verLine among them

  $("#libSort").value = PREFS.sort;
  $("#tmLang").value  = PREFS.lang;
  $("#setLang").value = PREFS.lang;
  $("#keyIn").value   = KEY;
  $("#ghToken").value = GH.token;
  $("#ghGist").value  = GH.gist;
  $("#ghAuto").checked = GH.auto !== false;
  $("#setRegion").value = PREFS.region || "";
  $("#setBirth").value = PREFS.birthYear || "";
  $("#setHomeLang").value = PREFS.homeLang || "";
  feed.key = PREFS.browse || "trend_week";
  $("#verLine").textContent = t("本地共 {0} 条记录 · 数据格式 v{1}", DB.entries.length, VERSION);
  setView(PREFS.view);

  wire();
  go("library");
  setSyncUI("");

  if (GH.token && GH.gist && GH.auto !== false) {
    lastAutoPull = Date.now();
    setTimeout(() => syncNow({ silent: true }), 600);
  }
  if (!KEY) {
    setTimeout(() => toast(t("先去「设置」填一个 TMDb key，搜索才能用")), 700);
  }
}

init();
</script>
