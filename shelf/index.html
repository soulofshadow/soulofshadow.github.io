<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>片柜 · Shelf</title>
<meta name="description" content="个人影视记录 — 追踪你看过的电影与剧集">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- iOS ignores data: URIs here, so this has to be a real file -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="片柜">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0b0d11; --panel:#13161c; --panel2:#1a1e26; --panel3:#232833;
  --fg:#e9ecf1; --dim:#98a0ad; --faint:#636b78;
  --line:#242932; --line2:#2f3540;
  --accent:#e0a94a; --accent-soft:#e0a94a22; --on-accent:#1a1305;
  --red:#e05f5f; --red-line:#6d3434; --green:#5cbb7a; --blue:#5b9bd5; --violet:#9b7fd4;
  --shadow:0 10px 40px -12px #000a;
  --radius:14px;
  --maxw:1360px;
}
[data-theme="light"]{
  --bg:#f6f5f3; --panel:#ffffff; --panel2:#f0eeea; --panel3:#e5e2dc;
  --fg:#1a1b1e; --dim:#5d636e; --faint:#8b919c;
  --line:#e2dfd9; --line2:#d2cec6;
  --accent:#a97516; --accent-soft:#a9751618; --on-accent:#fff;
  --red:#c14545; --red-line:#e3b6b6; --green:#3f8f59; --blue:#3a72a8; --violet:#7458b0;
  --shadow:0 8px 30px -14px #0003;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Segoe UI,Roboto,"Noto Sans SC",sans-serif;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- chrome ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:var(--maxw);margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.02em;margin-right:14px;white-space:nowrap}
.brand .mark{
  width:24px;height:24px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,var(--accent),#c47f2e);
  display:grid;place-items:center;font-size:13px;color:var(--on-accent);
}
nav.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:7px 13px;border-radius:9px;color:var(--dim);font-size:14px;font-weight:500;
  white-space:nowrap;transition:background .13s,color .13s;
}
.tab:hover{background:var(--panel2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--panel3);color:var(--fg)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--dim);flex:none;transition:background .13s,color .13s;
}
.icon-btn:hover{background:var(--panel2);color:var(--fg)}
.icon-btn[hidden]{display:none}   /* our display:grid would otherwise beat [hidden] */
.icon-btn.spin{animation:spin .9s linear infinite;color:var(--accent)}
.icon-btn.ok{color:var(--green)}
.icon-btn.err{color:var(--red)}
main{max-width:var(--maxw);margin:0 auto;padding:22px 20px 80px}
.page{display:none;animation:fade .22s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- generic ---------- */
.field{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;transition:border-color .13s,background .13s;
}
.field:focus{outline:none;border-color:var(--accent);background:var(--panel2)}
.field::placeholder{color:var(--faint)}
textarea.field{resize:vertical;min-height:80px;line-height:1.6}
select.field{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.btn{
  border:1px solid var(--line2);background:var(--panel);border-radius:10px;
  padding:8px 15px;font-size:14px;font-weight:500;
  transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:var(--panel2);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font-size:13.5px;white-space:nowrap;
  transition:all .13s;
}
.chip:hover{color:var(--fg);border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.tiny{font-size:12.5px}
.sec-title{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;margin-bottom:11px}
.empty{
  text-align:center;padding:70px 20px;color:var(--faint);
  border:1px dashed var(--line2);border-radius:var(--radius);
}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.6}
.spinner{
  width:17px;height:17px;border:2px solid var(--line2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1;min-width:180px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{padding:5px 10px;border-radius:7px;color:var(--dim);font-size:13px;transition:all .13s}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--fg)}
.filterbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.filterbar select{
  flex:none;width:auto;padding:6px 30px 6px 13px;border-radius:999px;
  font-size:13.5px;background-color:var(--panel);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;line-height:1.55;
  /* Safari otherwise draws its own boxed picker control, which matches nothing else */
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                   linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.filterbar select:hover{border-color:var(--line2);color:var(--fg)}
.filterbar select.on{
  background-color:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--on-accent) 50%),
                   linear-gradient(135deg,var(--on-accent) 50%,transparent 50%);
}

/* ---------- poster grid ---------- */
.grid{
  display:grid;gap:18px 15px;
  grid-template-columns:repeat(auto-fill,minmax(138px,1fr));
}
.card{text-align:left;width:100%;display:block;transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.card:hover{transform:translateY(-4px)}
.poster{
  display:block;position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;
  background:var(--panel2);box-shadow:var(--shadow);border:1px solid var(--line);
}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--faint);font-size:11px;text-align:center;padding:10px;line-height:1.4;
}
.badge{
  position:absolute;top:7px;left:7px;padding:3px 7px;border-radius:6px;
  font-size:11px;font-weight:650;letter-spacing:.02em;
  background:#000b;color:#fff;backdrop-filter:blur(6px);
}
.badge.s-watching{background:var(--green);color:#04120a}
.badge.s-done{background:var(--accent);color:var(--on-accent)}
.badge.s-plan{background:var(--blue);color:#04121e}
.badge.s-onhold{background:var(--violet);color:#0f0820}
.badge.s-dropped{background:#6b7280;color:#fff}
.score-pill{
  position:absolute;bottom:7px;right:7px;padding:3px 8px;border-radius:7px;
  background:#000c;color:var(--accent);font-size:12px;font-weight:700;
  backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;
}
.fav-dot{position:absolute;top:7px;right:8px;font-size:13px;filter:drop-shadow(0 1px 3px #000)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0007}
.prog i{display:block;height:100%;background:var(--accent)}
.card .t{margin-top:8px;font-size:13.5px;font-weight:530;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{display:block;font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- swipe deck ---------- */
.deck-wrap{max-width:360px;margin:0 auto}
.deck-stage{position:relative;aspect-ratio:2/3;margin-bottom:18px;touch-action:pan-y}
/* Named for the deck specifically: a bare .sc also matched the score in a list
   row, which inherited position:absolute;inset:0 and covered the whole list. */
.swipe-card{
  position:absolute;inset:0;border-radius:18px;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line2);box-shadow:0 18px 50px -18px #000c;
  display:flex;flex-direction:column;justify-content:flex-end;
  will-change:transform;user-select:none;-webkit-user-select:none;
}
.swipe-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swipe-card .veil{position:absolute;inset:0;background:linear-gradient(to top,#000e 4%,#0009 32%,transparent 62%)}
.swipe-card .meta{position:relative;padding:16px 17px 18px;color:#fff}
.swipe-card .meta h3{font-size:19px;line-height:1.25;font-weight:640;margin-bottom:5px}
.swipe-card .meta .sub{font-size:12.5px;opacity:.82;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.swipe-card .meta .ov{font-size:12.5px;line-height:1.6;opacity:.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.swipe-card .why{
  position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:7px;font-size:11.5px;
  background:#000a;color:#fff;backdrop-filter:blur(6px);max-width:calc(100% - 24px);
}
.swipe-card.top{cursor:grab}
.swipe-card.top:active{cursor:grabbing}
.swipe-card.glide{transition:transform .32s cubic-bezier(.3,.8,.4,1),opacity .32s}
.stamp{
  position:absolute;top:22px;padding:7px 16px;border-radius:10px;font-size:19px;font-weight:800;
  letter-spacing:.06em;border:3px solid currentColor;opacity:0;pointer-events:none;
  background:#000a;backdrop-filter:blur(4px);
}
.stamp.yes{right:18px;color:var(--green);transform:rotate(11deg)}
.stamp.no{left:18px;color:var(--red);transform:rotate(-11deg)}
.deck-actions{display:flex;justify-content:center;align-items:center;gap:15px}
.deck-btn{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;
  border:1px solid var(--line2);background:var(--panel);transition:transform .1s,border-color .13s;
}
.deck-btn:hover{border-color:currentColor}
.deck-btn:active{transform:scale(.9)}
.deck-btn.sm{width:44px;height:44px;font-size:17px}
.deck-btn.no{color:var(--red)}
.deck-btn.yes{color:var(--green)}
.deck-btn.want{color:var(--blue)}
.deck-btn.undo{color:var(--faint)}
.deck-hint{text-align:center;margin-top:15px;font-size:12.5px;color:var(--faint);line-height:1.7}

/* ---------- people ---------- */
.people{display:flex;gap:15px;overflow-x:auto;padding:2px 2px 16px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
/* A <button> vertically centres its own content, so once flex stretches these to
   equal height the shorter ones push their avatar down. Lay the card out as a
   column pinned to the top instead. */
.person{flex:none;width:80px;text-align:center;transition:transform .16s;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.person:hover{transform:translateY(-3px)}
.person .av{
  width:66px;height:66px;border-radius:50%;object-fit:cover;display:block;
  margin:0 auto 8px;background:var(--panel2);border:1px solid var(--line);
}
.person .ph2{display:grid;place-items:center;font-size:24px;color:var(--faint)}
.person .av{flex:none}
/* No reserved height: the role sits directly under the name. Names that wrap
   push their own role down a line, which reads better than a gap under every
   single-line name. */
.person .n{font-size:12.5px;line-height:1.3;font-weight:530;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.person .r{font-size:11px;line-height:1.35;color:var(--faint);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.person-head{display:flex;gap:13px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.person-head .av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--panel2);border:1px solid var(--line)}
.person-head .nm{font-size:17px;font-weight:620}

/* ---------- list view ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
/* <button> only admits phrasing content, so the row is built from spans and the
   button itself stays a plain block — Safari does not apply display:flex to a
   button box the way Chromium does, which stacked these into a giant column. */
.li{display:block;padding:11px 14px;background:var(--bg);text-align:left;width:100%;transition:background .12s}
.li-in{display:flex;gap:13px;align-items:center;width:100%}
.li:hover{background:var(--panel)}
.li .mini{display:block;width:40px;height:60px;border-radius:6px;object-fit:cover;background:var(--panel2);flex:none}
.li .body{display:block;flex:1;min-width:0}
.li .n{display:block;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12.5px;color:var(--faint);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.li .sc{display:block;font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(3px);
  display:none;padding:20px;overflow-y:auto;
}
.scrim.on{display:block;animation:fade .18s}
.sheet{
  max-width:820px;margin:0 auto;background:var(--bg);border:1px solid var(--line2);
  border-radius:18px;box-shadow:0 30px 90px -20px #000e;overflow:hidden;
  animation:pop .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.hero{position:relative;height:210px;background:var(--panel2)}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.5}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,transparent 75%)}
.hero .close{
  position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;
  background:#000a;color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px);font-size:18px;line-height:1;
}
.sheet-body{padding:0 26px 26px;position:relative}
.head{display:flex;gap:18px;margin-top:-70px;position:relative;z-index:2;align-items:flex-end}
.head .p{width:118px;flex:none;aspect-ratio:2/3;border-radius:11px;object-fit:cover;
  box-shadow:var(--shadow);border:1px solid var(--line2);background:var(--panel2)}
.head h2{font-size:23px;line-height:1.22;font-weight:660;margin-bottom:5px}
.head .sub{font-size:13px;color:var(--dim);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dot-sep::before{content:"·";margin-right:9px;color:var(--faint)}
.blk{margin-top:24px}
.ov{color:var(--dim);line-height:1.72;font-size:14.5px}
.genres{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.genres span{padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
/* Grid children default to min-width:auto, so an input that refuses to shrink below
   its intrinsic width drags the whole column past the viewport. */
.form-grid > *{min-width:0}
/* iOS Safari gives date inputs a wide intrinsic width from the localised format
   ("2023年12月25日"), centres the value and adds margins around it. Left unchecked
   that overflows the sheet on a phone. */
input[type="date"]{
  -webkit-appearance:none;appearance:none;
  min-width:0;max-width:100%;width:100%;
  min-height:38px;
}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;min-width:0}
input[type="date"]::-webkit-datetime-edit{padding:0}
label.lb{display:block;font-size:12.5px;color:var(--faint);margin-bottom:5px;font-weight:500}
/* ---------- seasons ---------- */
.season{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;background:var(--panel)}
.season > summary{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;list-style:none;user-select:none}
.season > summary::-webkit-details-marker{display:none}
.season > summary:hover{background:var(--panel2)}
.season .caret{color:var(--faint);transition:transform .18s;flex:none;font-size:11px}
.season[open] .caret{transform:rotate(90deg)}
.season .sname{font-weight:560;flex:1;min-width:0}
.season .scount{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.bar{display:block;height:3px;background:var(--panel3);border-radius:2px;overflow:hidden;width:56px;flex:none}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.eps{padding:5px 12px 13px;border-top:1px solid var(--line)}
.ep{display:flex;gap:10px;padding:7px 4px;align-items:flex-start;border-radius:7px;cursor:pointer;transition:background .12s}
.ep:hover{background:var(--panel2)}
.ep input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:none;cursor:pointer}
.ep .en{font-size:13.5px;line-height:1.45}
.ep .ed{font-size:12px;color:var(--faint);margin-top:1px}
.ep.seen .en{color:var(--dim)}
.ep-tools{display:flex;gap:7px;padding:9px 4px 3px;border-top:1px solid var(--line);margin-top:5px}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}
.stat .n{font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--faint);margin-top:3px}
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
.chart{justify-content:flex-start}
.chart .col{flex:1 1 0;min-width:22px;max-width:76px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.chart .bar2{width:100%;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;opacity:.85;transition:opacity .12s}
.chart .col:hover .bar2{opacity:1}
.chart .lab{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .cnt{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--panel3);border:1px solid var(--line2);color:var(--fg);
  padding:11px 19px;border-radius:11px;box-shadow:var(--shadow);z-index:200;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);font-size:14px;max-width:88vw;text-align:center;
}
#toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  main{padding:16px 14px 70px}
  .top-in{padding:0 14px;gap:4px}
  .brand span.name{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
  .scrim{padding:0}
  .sheet{border-radius:0;min-height:100vh;border:none}
  .hero{height:170px}
  .sheet-body{padding:0 17px 30px}
  .head{gap:13px;margin-top:-56px}
  .head .p{width:88px}
  .head h2{font-size:19px}
  .stat .n{font-size:24px}
  /* one field per row on a phone — no reflow surprises from intrinsic widths */
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">🎞</span><span class="name" data-i18n="片柜"></span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-page="library" aria-current="page" data-i18n="书架"></button>
      <button class="tab" data-page="search" data-i18n="搜索"></button>
      <button class="tab" data-page="deck" data-i18n="推荐"></button>
      <button class="tab" data-page="stats" data-i18n="统计"></button>
      <button class="tab" data-page="settings" data-i18n="设置"></button>
    </nav>
    <button class="icon-btn" id="syncBtn" data-i18n-title="立即同步" aria-label="Sync" hidden>⟳</button>
    <button class="icon-btn" id="themeBtn" data-i18n-title="切换主题" aria-label="Theme">◐</button>
  </div>
</header>

<main>

  <!-- ================= LIBRARY ================= -->
  <section class="page on" id="page-library">

        <option value="updated" data-i18n="最近更新"></option>

        <option value="year" data-i18n="年份"></option>

        <option value="finished" data-i18n="看完日期"></option>
      </select>
      <div class="seg" role="group" aria-label="View">
        <button id="vGrid" aria-pressed="true" data-i18n-title="海报墙">▦</button>
        <button id="vList" aria-pressed="false" data-i18n-title="列表">☰</button>
      </div>
    </div>

    <div class="filterbar" id="fType"></div>
    <div class="filterbar" id="fStatus"></div>
    <div class="filterbar" id="fMore"></div>

    <div id="libCount" class="tiny faint" style="margin-bottom:13px"></div>
    <div id="libBody"></div>
  </section>

  <!-- ================= SEARCH ================= -->
  <section class="page" id="page-search">

      <input class="field grow" id="tmQ" type="search" data-i18n-ph="搜电影 / 剧集 / 演员…  例：沙丘、梁朝伟、Breaking Bad" autocomplete="off">

        <option value="en-US">English</option>
      </select>
    </div>
    <div class="filterbar" id="browseBar"></div>
    <div id="tmBody"></div>
  </section>

  <!-- ================= DECK ================= -->
  <section class="page" id="page-deck">
    <div id="deckBody"></div>
  </section>

  <!-- ================= STATS ================= -->
  <section class="page" id="page-stats">
    <div id="statsBody"></div>
  </section>

    <div style="max-width:620px">

      </div>

        <div class="sec-title" data-i18n="院线地区"></div>

          <option value="CN" data-i18n="中国大陆"></option>

              <option value="de" data-i18n="德语"></option>

        <div class="row" style="margin-top:11px">

      </div>

const tp = k => (PROSE[k] && (PROSE[k][PREFS.lang] || PROSE[k]["zh-CN"])) || k;

function t(zh, ...args) {
  let out = PREFS.lang === "en-US" ? (EN[zh] !== undefined ? EN[zh] : zh) : zh;
  return args.length ? out.replace(/\{(\d+)\}/g, (m, i) => args[i] !== undefined ? args[i] : m) : out;
}

/** Text nodes, placeholders and titles declared in the static markup. */
function applyStaticI18n() {
  document.documentElement.lang = PREFS.lang === "en-US" ? "en" : "zh-CN";
  for (const el of $$("[data-i18n]"))       el.textContent = t(el.dataset.i18n);
  for (const el of $$("[data-i18n-html]"))  el.innerHTML   = tp(el.dataset.i18nHtml);
  for (const el of $$("[data-i18n-ph]"))    el.placeholder = t(el.dataset.i18nPh);
  for (const el of $$("[data-i18n-title]")) el.title       = t(el.dataset.i18nTitle);
}

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let toastTimer;

const localeTag = () => PREFS.lang === "en-US" ? "en-GB" : "zh-CN";

const ymd = d => {
  if (!d) return "";
  const x = new Date(d);
  return isNaN(x) ? "" : x.toISOString().slice(0, 10);
};
const yearOf = d => (d && /^\d{4}/.test(d)) ? d.slice(0, 4) : "";

function mins(n) {
  if (!n) return "";
  const h = Math.floor(n / 60), m = n % 60;
  if (!h) return t("{0} 分钟", m);
  return m ? t("{0} 小时 {1} 分", h, m) : t("{0} 小时", h);
}

/* ---------------- persistence ---------------- */

/** Backfill defaults on every entry so older exports keep working when the
 *  model grows a new field. Cheaper and safer than versioned migrations. */
function normalizeAll() {
  DB.entries = DB.entries.filter(e => e && e.id).map(e => blankEntry(e));   // also drops overview
  if (!DB.deleted || typeof DB.deleted !== "object") DB.deleted = {};
  if (!DB.skipped || typeof DB.skipped !== "object") DB.skipped = {};
}

function load() {
  try {
    const raw = localStorage.getItem(LS_DATA);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.entries)) DB = p;
    }
    normalizeAll();
  } catch (e) { console.warn("data load failed", e); }

  try {
    const raw = localStorage.getItem(LS_PREF);
    if (raw) Object.assign(PREFS, JSON.parse(raw));
  } catch (e) { /* defaults are fine */ }

  try { KEY = localStorage.getItem(LS_KEY) || ""; } catch (e) { KEY = ""; }

  try {
    const raw = localStorage.getItem(LS_GH);
    if (raw) Object.assign(GH, JSON.parse(raw));
  } catch (e) { /* defaults are fine */ }
}

let saveTimer;
function save() {
  DB.version = VERSION;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_DATA, JSON.stringify(DB));
    } catch (e) {
      toast(t("保存失败：浏览器存储可能已满，请先导出备份"));
      console.error(e);
    }
    scheduleSync();
  }, 200);
}

function saveGH() {
  try { localStorage.setItem(LS_GH, JSON.stringify(GH)); } catch (e) {}
}

function savePrefs() {
  try { localStorage.setItem(LS_PREF, JSON.stringify(PREFS)); } catch (e) {}
}

/* ---------------- TMDb ---------------- */

async function tmdb(path, params = {}) {
  if (!KEY) throw new Error("NO_KEY");
  const url = new URL("https://api.themoviedb.org/3" + path);
  url.searchParams.set("language", PREFS.lang);
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  }

  const headers = {};
  // v4 read access tokens are JWTs; v3 keys are plain hex.
  if (KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + KEY;
  else url.searchParams.set("api_key", KEY);

  const res = await fetch(url, { headers });
  if (res.status === 401) throw new Error("BAD_KEY");
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ---------------- entries ---------------- */

const idOf = (type, tmdbId) => `${type}-${tmdbId}`;
const find = id => DB.entries.find(e => e.id === id);

function fromTMDb(r) {
  const type = r.media_type || (r.title ? "movie" : "tv");
  const date = r.release_date || r.first_air_date || "";
  return {
    id: idOf(type, r.id),
    tmdbId: r.id,
    mediaType: type,
    title: r.title || r.name || t("未命名"),
    originalTitle: r.original_title || r.original_name || "",
    year: yearOf(date),
    releaseDate: date,
    poster: r.poster_path || null,
    backdrop: r.backdrop_path || null,
    overview: r.overview || "",
    tmdbScore: r.vote_average || 0,
  };
}

function blankEntry(base) {
  const e = Object.assign({
    genres: [], runtime: 0, seasonsMeta: null, detailLoaded: false,
    addedAt: Date.now(), updatedAt: Date.now(),
    status: "plan", favorite: false, notes: "",
    startedAt: "", finishedAt: "", rewatch: 0, progress: {},
  }, base);
  delete e.overview;     // re-fetchable; see the extras cache
  delete e.why;          // deck-only annotation
  return e;
}

function addEntry(base) {
  if (find(base.id)) { toast(t("已经在书架里了")); return find(base.id); }
  const e = blankEntry(base);
  DB.entries.push(e);
  save();
  toast(t("已加入书架 · {0}", e.title));
  return e;
}

function touch(e) { e.updatedAt = Date.now(); save(); }

function dropLocal(id) {
  const i = DB.entries.findIndex(e => e.id === id);
  if (i >= 0) { DB.entries.splice(i, 1); return true; }
  return false;
}

function removeEntry(id) {
  if (dropLocal(id)) {
    DB.deleted[id] = Date.now();   // tombstone, so other devices don't resurrect it
    save();
  }
}

/* progress helpers — season 0 (specials) never counts toward completion */
function totalEps(e) {
  if (!e.seasonsMeta) return 0;
  return e.seasonsMeta.filter(s => s.n > 0).reduce((a, s) => a + s.count, 0);
}
function watchedEps(e) {
  return Object.entries(e.progress || {})
    .filter(([n]) => Number(n) > 0)
    .reduce((a, [, list]) => a + list.length, 0);
}
function progressPct(e) {
  if (e.mediaType !== "tv") return e.status === "done" ? 1 : 0;
  const tot = totalEps(e);
  return tot ? Math.min(1, watchedEps(e) / tot) : 0;
}

/* ---------------- detail fetch ---------------- */

async function ensureDetail(e, force = false) {
  if (e.detailLoaded && !force) return e;
  if (force) extras.delete(extrasKey(e));
  const d = await fetchWork(e);
  e.title         = d.title || d.name || e.title;
  e.originalTitle = d.original_title || d.original_name || e.originalTitle;
  e.poster        = d.poster_path || e.poster;
  e.backdrop      = d.backdrop_path || e.backdrop;
  e.genres        = (d.genres || []).map(g => g.name);
  e.tmdbScore     = d.vote_average || e.tmdbScore;
  const date      = d.release_date || d.first_air_date || e.releaseDate;
  e.releaseDate   = date;
  e.year          = yearOf(date);

  if (e.mediaType === "movie") {
    e.runtime = d.runtime || 0;
  } else {
    e.runtime = (d.episode_run_time && d.episode_run_time[0]) || 0;
    e.seasonsMeta = (d.seasons || []).map(s => ({
      n: s.season_number,
      name: s.name,
      count: s.episode_count || 0,
      air: s.air_date || "",
      poster: s.poster_path || null,
    }));
  }
  e.detailLoaded = true;
  touch(e);
  return e;
}

/* Overview and cast are the two big re-fetchable fields. Neither is stored on
   the entry — together they were over half the synced payload — and one request
   with append_to_response brings back both. */
const extras = new Map();
const extrasKey = e => `${e.mediaType}-${e.tmdbId}-${PREFS.lang}`;

async function fetchWork(e) {
  const d = await tmdb(`/${e.mediaType}/${e.tmdbId}`, { append_to_response: "credits" });
  extras.set(extrasKey(e), {
    overview: d.overview || "",
    cast: ((d.credits && d.credits.cast) || []).slice(0, 12).map(p => ({
      id: p.id, name: p.name, character: p.character || "", photo: p.profile_path,
    })),
  });
  return d;
}

async function ensureExtras(e) {
  const k = extrasKey(e);
  if (extras.has(k)) return extras.get(k);
  await fetchWork(e);
  return extras.get(k);
}

const seasonCache = new Map();
async function fetchSeason(tvId, n) {
  const k = `${tvId}/${n}/${PREFS.lang}`;
  if (seasonCache.has(k)) return seasonCache.get(k);
  const d = await tmdb(`/tv/${tvId}/season/${n}`);
  const eps = d.episodes || [];
  seasonCache.set(k, eps);
  return eps;
}

/* Paging by whole rows means knowing the column count, which is width-dependent.
   The laid-out grid is the only source that can't drift from the CSS — the
   arithmetic below is just a first-render fallback, and has to track the 640px
   breakpoint where minmax/gap change. */
function gridCols(host) {
  const g = host && host.querySelector(".grid");
  if (g) {
    const n = getComputedStyle(g).gridTemplateColumns.split(" ").filter(Boolean).length;
    if (n) return n;
  }
  const mobile = innerWidth <= 640;
  const min = mobile ? 104 : 138, gap = mobile ? 10 : 15;
  // a hidden or not-yet-laid-out host measures 0; the viewport is still a real number
  const w = (host && host.clientWidth) || (document.querySelector("main") || {}).clientWidth || 0;
  if (!w) return mobile ? 3 : 6;
  return Math.max(1, Math.floor((w + gap) / (min + gap)));
}

let libPages = 1;                    // library: 5 rows per page
let libShowAll = false;
const LIB_ROWS = 5;

const decadeOf = e => (e.year && /^\d{4}$/.test(e.year))
  ? String(Math.floor(+e.year / 10) * 10) : "";

/** All active filters except `skip`, so a facet can count without counting itself. */
function applyFilters(list, skip = "") {
  const q = $("#libQ").value.trim().toLowerCase();

  if (skip !== "type" && PREFS.fType !== "all") {
    if (PREFS.fType === "fav") list = list.filter(e => e.favorite);
    else list = list.filter(e => e.mediaType === PREFS.fType);
  }
  if (skip !== "status" && PREFS.fStatus !== "all") list = list.filter(e => e.status === PREFS.fStatus);
  if (skip !== "genre"  && PREFS.fGenre !== "all")  list = list.filter(e => (e.genres || []).includes(PREFS.fGenre));
  if (skip !== "decade" && PREFS.fDecade !== "all") list = list.filter(e => decadeOf(e) === PREFS.fDecade);

  if (q) {
    list = list.filter(e =>
      e.title.toLowerCase().includes(q) ||
      (e.originalTitle || "").toLowerCase().includes(q) ||
      (e.notes || "").toLowerCase().includes(q) ||
      (e.genres || []).some(g => g.toLowerCase().includes(q)));
  }
  return list;
}

function anyFilterActive() {
  return PREFS.fType !== "all" || PREFS.fStatus !== "all" || PREFS.fGenre !== "all"
      || PREFS.fDecade !== "all" || !!$("#libQ").value.trim();
}

function visibleEntries() {
  let list = applyFilters(DB.entries.slice());
  const s = PREFS.sort;
  list.sort((a, b) => {
    switch (s) {
      case "title":    return a.title.localeCompare(b.title, localeTag());
      case "year":     return (b.year || "0").localeCompare(a.year || "0");
      case "rating":   return (b.tmdbScore || 0) - (a.tmdbScore || 0) || (b.updatedAt - a.updatedAt);
      case "updated":  return b.updatedAt - a.updatedAt;
      case "finished": return (b.finishedAt || "").localeCompare(a.finishedAt || "");
      default:         return b.addedAt - a.addedAt;
    }
  });
  return list;
}

function renderFilters() {
  const types = [
    ["all", t("全部")], ["movie", t("电影")], ["tv", t("剧集")], ["fav", t("★ 收藏")],
  ];
  $("#fType").innerHTML = types.map(([v, l]) =>
    `<button class="chip" data-ftype="${v}" aria-pressed="${PREFS.fType === v}">${l}</button>`).join("");

  // Facet counts reflect every *other* active filter, so "看完 443" can't keep
  // claiming 443 while the genre filter has cut the list to 196.
  const forStatus = applyFilters(DB.entries.slice(), "status");
  const counts = {};
  for (const e of forStatus) counts[e.status] = (counts[e.status] || 0) + 1;
  const stat = [["all", t("所有状态"), forStatus.length]]
    .concat(STATUS_ORDER.map(k => [k, t(STATUS[k].label), counts[k] || 0]));
  $("#fStatus").innerHTML = stat.map(([v, l, c]) =>
    `<button class="chip" data-fstatus="${v}" aria-pressed="${PREFS.fStatus === v}">${l}${c ? ` <span class="faint">${c}</span>` : ""}</button>`).join("");

  renderMoreFilters();
}

/** Genre / decade / score. Options come from what's actually in the library,
 *  so you can never pick something that yields nothing. */
function renderMoreFilters() {
  const opt = (v, label, sel) =>
    `<option value="${esc(v)}"${sel === v ? " selected" : ""}>${esc(label)}</option>`;

  const gPool = applyFilters(DB.entries.slice(), "genre");
  const gCount = {};
  for (const e of gPool) for (const g of (e.genres || [])) gCount[g] = (gCount[g] || 0) + 1;
  const genres = Object.entries(gCount).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh"));

  const dPool = applyFilters(DB.entries.slice(), "decade");
  const dCount = {};
  for (const e of dPool) { const d = decadeOf(e); if (d) dCount[d] = (dCount[d] || 0) + 1; }
  const decades = Object.keys(dCount).sort((a, b) => b - a);

  $("#fMore").innerHTML =
    `<select id="selGenre" class="${PREFS.fGenre !== "all" ? "on" : ""}" aria-label="类型">
       ${opt("all", t("所有类型"), PREFS.fGenre)}
       ${genres.map(([g, c]) => opt(g, `${g} · ${c}`, PREFS.fGenre)).join("")}
     </select>
     <select id="selDecade" class="${PREFS.fDecade !== "all" ? "on" : ""}" aria-label="年代">
       ${opt("all", t("所有年代"), PREFS.fDecade)}
       ${decades.map(d => opt(d, t("{0} 年代 · {1}", d, dCount[d]), PREFS.fDecade)).join("")}
     </select>
    `;
}

function resetLibPaging() {
  libPages = 1;
  libShowAll = false;
  // The list is about to get much shorter — 450 posters down to 25 rows collapses
  // the page from ~35,000px to ~2,700px. Leaving the scroll offset deep in the old
  // content strands the reader at the bottom, and iOS Safari often fails to repaint
  // after a clamp that large, showing a blank viewport instead.
  if (page === "library" && window.scrollY > 0) window.scrollTo(0, 0);
}

function renderLibrary() {
  renderFilters();
  const list = visibleEntries();
  const body = $("#libBody");

  $("#libCount").innerHTML = DB.entries.length
    ? t("显示 {0} / {1} 条", list.length, DB.entries.length)
      + (anyFilterActive()
          ? ` · <button id="clearFilters" style="color:var(--accent);font-size:inherit">${t("✕ 清除筛选")}</button>`
          : "")
    : "";

  if (!DB.entries.length) {
    body.innerHTML = `<div class="empty">
      <div class="big">🎞️</div>
      <div style="font-size:15px;color:var(--dim);margin-bottom:6px">${t("书架还是空的")}</div>
      <div class="tiny">${t("去「搜索」加第一部片子")}${KEY ? "" : t("，不过得先在「设置」里填 TMDb key")}</div>
    </div>`;
    return;
  }
  if (!list.length) {
    body.innerHTML = `<div class="empty"><div class="big">🔍</div><div class="tiny">${t("没有符合条件的条目")}</div></div>`;
    return;
  }

  const cols  = gridCols(body);
  const step  = PREFS.view === "grid" ? LIB_ROWS * cols : LIB_ROWS * 5;
  const limit = libShowAll ? list.length : Math.min(list.length, libPages * step);
  const page  = list.slice(0, limit);
  const rest  = list.length - limit;

  body.innerHTML = (PREFS.view === "grid"
    ? `<div class="grid">${page.map(e => posterCard(e)).join("")}</div>`
    : `<div class="list">${page.map(listRow).join("")}</div>`)
    + (rest > 0
      ? `<div class="row" style="justify-content:center;gap:11px;margin-top:26px">
           <button class="btn" data-libmore>${t("加载更多 · 还有 {0} 条", rest)}</button>
           <button class="btn sm" data-liball>${t("显示全部")}</button>
         </div>`
      : (list.length > step
          ? `<div class="tiny faint" style="text-align:center;margin-top:26px">${t("已显示全部 {0} 条", list.length)}</div>`
          : ""));
}

/* Discovery rows. `type` is forced onto results from the endpoints that
   don't return media_type; `region` marks the two that care about it. */
const BROWSE = [
  { key: "trend_week", label: "本周热门",   path: "/trending/all/week" },
  { key: "trend_day",  label: "今日热门",   path: "/trending/all/day" },
  { key: "pop_movie",  label: "热门电影",   path: "/movie/popular",     type: "movie" },
  { key: "pop_tv",     label: "热门剧集",   path: "/tv/popular",        type: "tv" },
  { key: "top_movie",  label: "高分电影",   path: "/movie/top_rated",   type: "movie" },
  { key: "top_tv",     label: "高分剧集",   path: "/tv/top_rated",      type: "tv" },
  { key: "now_movie",  label: "正在热映",   path: "/movie/now_playing", type: "movie", region: true },
  { key: "soon_movie", label: "即将上映",   path: "/movie/upcoming",    type: "movie", region: true },
  { key: "air_tv",     label: "本周播出",   path: "/tv/on_the_air",     type: "tv" },
];

let searchSeq = 0;
const FEED_ROWS = 2;                 // search/charts: reveal two full rows at a time
let feed = { mode: "browse", key: "trend_week", q: "", page: 1, totalPages: 1,
             rows: FEED_ROWS, hits: [], people: [], person: null, loading: false };

function resultCard(h) {
  const owned = !!find(h.id);
  const src = IMG(h.poster, "w342");
  return `
  <button class="card" data-add="${esc(h.id)}" data-tmdb="${h.tmdbId}" data-type="${h.mediaType}">
    <span class="poster">
      ${src ? `<img src="${src}" alt="" loading="lazy" decoding="async">`
            : `<span class="ph">${esc(h.title)}</span>`}
      ${owned ? `<span class="badge s-done">${t("已在书架")}</span>`
              : `<span class="badge">${t(h.mediaType === "movie" ? "电影" : "剧集")}</span>`}
      ${h.tmdbScore ? `<span class="score-pill">${h.tmdbScore.toFixed(1)}</span>` : ""}
    </span>
    <span class="t">${esc(h.title)}</span>
    <span class="y">${h.year || "—"}</span>
  </button>`;
}

function personCard(p) {
  const src = IMG(p.profile_path, "w185");
  const known = (p.known_for || [])
    .map(k => k.title || k.name).filter(Boolean).slice(0, 2).join(" · ");
  return `
  <button class="person" data-person="${p.id}" title="${esc(p.name)}">
    ${src ? `<img class="av" src="${src}" alt="" loading="lazy">`
          : `<span class="av ph2">🎭</span>`}
    <span class="n">${esc(p.name)}</span>
    ${known ? `<span class="r">${esc(known)}</span>` : ""}
  </button>`;
}

function renderBrowseBar() {
  const active = feed.mode === "browse" ? feed.key : null;
  $("#browseBar").innerHTML = BROWSE.map(b =>
    `<button class="chip" data-browse="${b.key}" aria-pressed="${active === b.key}">${t(b.label)}</button>`).join("");
}

function renderFeed() {
  const body = $("#tmBody");
  renderBrowseBar();

  const people = (feed.mode === "search" && feed.people.length)
    ? `<div class="sec-title" style="margin-bottom:9px">${t("演职人员")}</div>
       <div class="people">${feed.people.map(personCard).join("")}</div>` : "";

  const head = (feed.mode === "person" && feed.person)
    ? `<div class="person-head">
         ${IMG(feed.person.photo, "w185")
            ? `<img class="av" src="${IMG(feed.person.photo, "w185")}" alt="">`
            : `<div class="av"></div>`}
         <div style="flex:1;min-width:0">
           <div class="nm">${esc(feed.person.name)}</div>
           <div class="tiny faint">${t("{0} 部参演作品", feed.hits.length)}</div>
         </div>
         <button class="btn sm" data-backsearch>${t("← 返回搜索")}</button>
       </div>` : "";

  if (!feed.hits.length) {
    body.innerHTML = head + people + (feed.mode === "search"
      ? `<div class="empty"><div class="big">🤷</div><div class="tiny">${t("没有片名匹配「{0}」", esc(feed.q))}${
           feed.people.length ? t("，试试上面的演职人员") : ""}</div></div>`
      : `<div class="empty"><div class="big">📭</div><div class="tiny">${t("这个榜单暂时没有内容")}</div></div>`);
    return;
  }
  const cols  = gridCols(body);
  const limit = Math.min(feed.hits.length, feed.rows * cols);
  const shown = feed.hits.slice(0, limit);
  const hasHidden = limit < feed.hits.length;
  const canFetch  = feed.page < feed.totalPages;

  body.innerHTML = head + people +
    `<div class="grid">${shown.map(resultCard).join("")}</div>` +
    (hasHidden || canFetch
      ? `<div style="text-align:center;margin-top:26px">
           <button class="btn" id="moreBtn">${t("加载更多")}</button>
         </div>`
      : `<div class="tiny faint" style="text-align:center;margin-top:26px">${t("没有更多了")}</div>`);
  body._hits = feed.hits;
}

async function loadFeed(reset = false) {
  const body = $("#tmBody");

  if (!KEY) {
    renderBrowseBar();
    body.innerHTML = `<div class="empty">
      <div class="big">🔑</div>
      <div style="font-size:15px;color:var(--dim);margin-bottom:6px">${t("还没有 TMDb key")}</div>
      <div class="tiny">${t("去「设置」里填一个，搜索和榜单才能用")}</div>
    </div>`;
    return;
  }
  if (feed.loading) return;
  feed.loading = true;

  const seq = ++searchSeq;
  if (reset) {
    feed.page = 1; feed.hits = []; feed.totalPages = 1; feed.rows = FEED_ROWS;
    if (feed.mode !== "search") feed.people = [];
    renderBrowseBar();
    body.innerHTML = `<div class="empty"><span class="spinner"></span>&nbsp; ${t("加载中…")}</div>`;
  } else {
    const b = $("#moreBtn");
    if (b) { b.disabled = true; b.innerHTML = `<span class="spinner"></span> ${t("加载中…")}`; }
  }

  try {
    let d, forced = null;
    if (feed.mode === "person") {
      // combined_credits returns a whole filmography at once — no paging
      const c = await tmdb(`/person/${feed.person.id}/combined_credits`);
      // Talk / news / reality credits are "appeared as themselves" noise and, being
      // long-running, out-popularity the actual work.
      const CHATTER = [10767, 10763, 10764];
      const isChatter = r => (r.genre_ids || []).some(g => CHATTER.includes(g));
      const seenC = new Set();
      const rows = [];
      for (const r of (c.cast || [])) {
        const k = `${r.media_type}-${r.id}`;
        if (r.adult || isChatter(r) || seenC.has(k)) continue;
        seenC.add(k); rows.push(r);
      }
      // a director/writer's own films belong here too; their music credits don't
      for (const r of (c.crew || [])) {
        const k = `${r.media_type}-${r.id}`;
        if (r.adult || seenC.has(k)) continue;
        if (isChatter(r)) continue;
        if (r.department !== "Directing" && r.department !== "Writing") continue;
        seenC.add(k); rows.push(r);
      }
      rows.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      d = { results: rows, total_pages: 1 };
    } else if (feed.mode === "search") {
      d = await tmdb("/search/multi", { query: feed.q, include_adult: "false", page: feed.page });
      // TMDb returns a long tail of empty namesakes — keep the ones with a face or a credit
      feed.people = feed.page === 1
        ? (d.results || [])
            .filter(r => r.media_type === "person" && (r.profile_path || (r.known_for || []).length))
            .slice(0, 10)
        : feed.people;
    } else {
      const cat = BROWSE.find(b => b.key === feed.key) || BROWSE[0];
      forced = cat.type || null;
      d = await tmdb(cat.path, {
        page: feed.page,
        ...(cat.region && PREFS.region ? { region: PREFS.region } : {}),
      });
    }
    if (seq !== searchSeq) return;                        // a newer request won

    feed.totalPages = Math.min(d.total_pages || 1, 500);  // TMDb caps paging at 500
    const fresh = (d.results || [])
      .map(r => forced ? { ...r, media_type: forced } : r)
      .filter(r => r.media_type === "movie" || r.media_type === "tv")
      .map(fromTMDb);

    const seen = new Set(feed.hits.map(h => h.id));
    for (const h of fresh) if (!seen.has(h.id)) feed.hits.push(h);
    renderFeed();
  } catch (err) {
    if (seq !== searchSeq) return;
    renderBrowseBar();
    body.innerHTML = `<div class="empty"><div class="big">⚠️</div><div class="tiny">${
      err.message === "BAD_KEY" ? t("API key 无效 —— 去设置里检查一下")
      : err.message === "NO_KEY" ? t("还没填 API key")
      : t("请求失败：{0}", esc(err.message))}</div></div>`;
  } finally {
    feed.loading = false;
  }
}

function showPerson(p) {
  feed.mode = "person";
  feed.person = p;
  loadFeed(true);
  window.scrollTo(0, 0);
}

function showBrowse(key) {
  feed.mode = "browse";
  feed.person = null;
  feed.key  = key || feed.key;

  $("#tmQ").value = "";

function showSearch(q) {

/* ============================================================
   SWIPE DECK
   Candidates come mostly from what's already on the shelf; birth year and
   home language are coarse extras the library simply cannot supply.
   ============================================================ */

let deck = { cards: [], i: 0, loading: false, history: [], seen: new Set() };
let genreIds = null;   // Chinese genre name -> TMDb id

async function loadGenreIds() {
  if (genreIds) return genreIds;
  const [m, t] = await Promise.all([
    tmdb("/genre/movie/list"), tmdb("/genre/tv/list"),
  ]);
  genreIds = {};
  for (const g of [...(m.genres || []), ...(t.genres || [])]) genreIds[g.name] = g.id;
  return genreIds;
}

/** Weighted counts of what's on the shelf. Favourites and finished titles count more. */
function tasteProfile() {
  const g = {}, d = {};
  for (const e of DB.entries) {
    const w = (e.favorite ? 3 : 1) + (e.status === "done" ? 1 : 0);
    for (const x of (e.genres || [])) g[x] = (g[x] || 0) + w;
    const dec = decadeOf(e);
    if (dec) d[dec] = (d[dec] || 0) + w;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k]) => k);
  return { genres: top(g), decades: top(d) };
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const randPage = n => 1 + Math.floor(Math.random() * n);

/** Several independent probes, so the deck doesn't turn into one long genre. */
async function candidateQueries() {
  const ids = await loadGenreIds();
  const taste = tasteProfile();
  const gid = taste.genres.map(n => ids[n]).filter(Boolean);
  const out = [];

  if (gid.length) {
    out.push({ why: t("你常看{0}", taste.genres[0]), path: "/discover/movie", params: {
      with_genres: gid.slice(0, 2).join("|"), "vote_count.gte": 300,
      sort_by: "popularity.desc", page: randPage(5) } });
    out.push({ why: t("{0}高口碑", taste.genres[1] || taste.genres[0]), path: "/discover/movie", params: {
      with_genres: gid.slice(1, 4).join("|"), "vote_count.gte": 500,
      sort_by: "vote_average.desc", page: randPage(3) } });
    out.push({ why: t("{0}剧集", taste.genres[0]), path: "/discover/tv", params: {
      with_genres: gid.slice(0, 3).join("|"), "vote_count.gte": 150,
      sort_by: "popularity.desc", page: randPage(3) } });
  }

  const dec = taste.decades[0];
  if (dec) {
    out.push({ why: t("{0} 年代", dec), path: "/discover/movie", params: {
      "primary_release_date.gte": `${dec}-01-01`,
      "primary_release_date.lte": `${+dec + 9}-12-31`,
      "vote_count.gte": 400, sort_by: "popularity.desc", page: randPage(4) } });
  }

  // The films someone is likeliest to have seen are the ones from when they were 12-25.
  const by = parseInt(PREFS.birthYear, 10);
  if (by > 1900 && by < 2020) {
    out.push({ why: t("你 12–25 岁时的片子"), path: "/discover/movie", params: {
      "primary_release_date.gte": `${by + 12}-01-01`,
      "primary_release_date.lte": `${by + 25}-12-31`,
      "vote_count.gte": 300, sort_by: "popularity.desc", page: randPage(5) } });
  }

  if (PREFS.homeLang) {
    out.push({ why: t("你的母语电影"), path: "/discover/movie", params: {
      with_original_language: PREFS.homeLang, "vote_count.gte": 80,
      sort_by: "vote_average.desc", page: randPage(4) } });
    out.push({ why: t("你的母语剧集"), path: "/discover/tv", params: {
      with_original_language: PREFS.homeLang, "vote_count.gte": 40,
      sort_by: "popularity.desc", page: randPage(2) } });
  }

  // "Because you watched X" — the single most direct signal available.
  const seeds = shuffle(DB.entries.filter(e => e.favorite || e.status === "done")).slice(0, 3);
  for (const sd of seeds) {
    out.push({ why: t("因为你看过《{0}》", sd.title), path: `/${sd.mediaType}/${sd.tmdbId}/recommendations`,
               params: { page: 1 }, forced: sd.mediaType });
  }
  return shuffle(out);
}

async function loadDeck(more = false) {
  if (deck.loading) return;
  deck.loading = true;
  if (!more) { deck.cards = []; deck.i = 0; deck.history = []; deck.seen = new Set(); }
  renderDeck();

  try {
    const qs = (await candidateQueries()).slice(0, 6);
    const pages = await Promise.all(qs.map(async q => {
      try { return { q, d: await tmdb(q.path, q.params) }; }
      catch { return null; }
    }));

    const fresh = [];
    for (const pg of pages) {
      if (!pg) continue;
      for (const r of (pg.d.results || [])) {
        const type = r.media_type || pg.q.forced || (r.title ? "movie" : "tv");
        if (type !== "movie" && type !== "tv") continue;
        if (r.adult) continue;
        const c = fromTMDb({ ...r, media_type: type });
        if (!c.poster) continue;                       // a card with no art is a bad card
        if (find(c.id) || DB.skipped[c.id]) continue;  // already judged
        if (deck.seen.has(c.id)) continue;
        deck.seen.add(c.id);
        fresh.push({ ...c, why: pg.q.why });
      }
    }
    // interleave the sources so one probe can't dominate the top of the pile
    const byWhy = {};
    for (const c of fresh) (byWhy[c.why] ||= []).push(c);
    const lanes = Object.values(byWhy).map(shuffle);
    const woven = [];
    for (let k = 0; lanes.some(l => l.length); k++) for (const l of lanes) if (l.length) woven.push(l.shift());

    deck.cards = deck.cards.slice(0, deck.i).concat(woven);
  } catch (err) {
    console.warn("deck load failed", err);
  } finally {
    deck.loading = false;
    renderDeck();
  }
}

function deckCardHTML(c, top) {
  const src = IMG(c.backdrop, "w780") || IMG(c.poster, "w500");
  return `
  <div class="swipe-card${top ? " top" : ""}" data-card="${esc(c.id)}">
    ${src ? `<img src="${src}" alt="" draggable="false">` : ""}
    <div class="veil"></div>
    ${c.why ? `<span class="why">${esc(c.why)}</span>` : ""}
    <span class="stamp yes">${t("看过")}</span>
    <span class="stamp no">${t("没看过")}</span>
    <div class="meta">
      <h3>${esc(c.title)}</h3>
      <div class="sub">
        <span>${c.year || "—"}</span>
        <span>${t(c.mediaType === "movie" ? "电影" : "剧集")}</span>
        ${c.tmdbScore ? `<span>TMDb ${c.tmdbScore.toFixed(1)}</span>` : ""}
      </div>
      ${c.overview ? `<div class="ov">${esc(c.overview)}</div>` : ""}
    </div>
  </div>`;
}

function renderDeck() {
  const body = $("#deckBody");

  if (!KEY) {
    body.innerHTML = `<div class="empty"><div class="big">🔑</div>
      <div class="tiny">${t("先去「设置」填 TMDb key")}</div></div>`;
    return;
  }
  if (!DB.entries.length) {
    body.innerHTML = `<div class="empty"><div class="big">🎬</div>
      <div style="font-size:15px;color:var(--dim);margin-bottom:6px">${t("书架还是空的")}</div>
      <div class="tiny">${t("推荐是从你看过的东西里推出来的，先记几部再回来")}</div></div>`;
    return;
  }
  if (deck.loading && deck.i >= deck.cards.length) {
    body.innerHTML = `<div class="empty"><span class="spinner"></span>&nbsp; ${t("正在挑片…")}</div>`;
    return;
  }
  if (deck.i >= deck.cards.length) {
    body.innerHTML = `<div class="empty">
      <div class="big">🎞️</div>
      <div style="font-size:15px;color:var(--dim);margin-bottom:10px">${t("这一轮划完了")}</div>
      <button class="btn primary" data-deckmore>${t("再来一批")}</button>
    </div>`;
    return;
  }

  // only the next two are in the DOM; the rest stay as data
  const stack = deck.cards.slice(deck.i, deck.i + 2).reverse();
  body.innerHTML = `
    <div class="deck-wrap">
      <div class="deck-stage" id="deckStage">
        ${stack.map((c, n) => deckCardHTML(c, n === stack.length - 1)).join("")}
      </div>
      <div class="deck-actions">
        <button class="deck-btn no"   data-swipe="no"   title="${t("没看过")}">✕</button>
        <button class="deck-btn sm undo" data-swipe="undo" title="${t("撤销上一张")}"${deck.history.length ? "" : " disabled"}>↶</button>
        <button class="deck-btn sm want" data-swipe="want" title="${t("想看")}">＋</button>
        <button class="deck-btn yes"  data-swipe="yes"  title="${t("看过")}">✓</button>
      </div>
      <div class="deck-hint">
        ${t("左划 = 没看过 · 右划 = 看过 · ＋ 加入想看")}<br>
        ${t("还剩 {0} 张", deck.cards.length - deck.i)}
      </div>
    </div>`;
  bindTopCard();
}

/** Commit the top card. `dir` is one of yes / no / want. */
function deckAct(dir) {
  const c = deck.cards[deck.i];
  if (!c) return;

  if (dir === "yes" || dir === "want") {
    const e = blankEntry({ ...c });
    delete e.why;
    e.status = dir === "yes" ? "done" : "plan";
    DB.entries.push(e);
    deck.history.push({ id: c.id, action: dir });
  } else {
    DB.skipped[c.id] = Date.now();
    deck.history.push({ id: c.id, action: "no" });
  }
  deck.i++;
  save();
  if (deck.cards.length - deck.i <= 3) loadDeck(true);   // top up before running dry
  renderDeck();
}

function deckUndo() {
  const last = deck.history.pop();
  if (!last) return;
  if (last.action === "no") delete DB.skipped[last.id];
  else {
    const k = DB.entries.findIndex(e => e.id === last.id);
    if (k >= 0) DB.entries.splice(k, 1);
  }
  deck.i = Math.max(0, deck.i - 1);
  save();
  renderDeck();
}

/** Pointer-drag on the top card, with the buttons as the accessible path. */
function bindTopCard() {
  const card = $("#deckStage .swipe-card.top");
  if (!card) return;
  const yes = $(".stamp.yes", card), no = $(".stamp.no", card);
  let id = null, x0 = 0, y0 = 0, dx = 0, dy = 0, dragging = false, t0 = 0, moved = false;

  card.addEventListener("pointerdown", ev => {
    if (ev.button) return;
    id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY; dragging = true;
    t0 = Date.now(); moved = false;
    card.setPointerCapture(id);
    card.classList.remove("glide");
  });

  card.addEventListener("pointermove", ev => {
    if (!dragging || ev.pointerId !== id) return;
    dx = ev.clientX - x0; dy = ev.clientY - y0;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    moved = true;
    card.style.transform = `translate(${dx}px, ${dy * 0.28}px) rotate(${dx / 22}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity  = Math.max(0, Math.min(1, -dx / 90));
  });

  const release = ev => {
    if (!dragging || (ev.pointerId !== undefined && ev.pointerId !== id)) return;
    dragging = false;
    try { card.releasePointerCapture(id); } catch (e) {}

    // A tap, not a drag: show the full record instead of judging the card.
    if (!moved && Date.now() - t0 < 500) {
      const c = deck.cards[deck.i];
      if (c) {
        const draftCard = blankEntry({ ...c });
        delete draftCard.why;
        openSheet(c.id, draftCard);
      }
      return;
    }

    const hit = Math.abs(dx) > 92;
    card.classList.add("glide");
    if (hit) {
      const dir = dx > 0 ? "yes" : "no";
      card.style.transform = `translate(${dx > 0 ? 700 : -700}px, ${dy}px) rotate(${dx / 12}deg)`;
      card.style.opacity = "0";
      setTimeout(() => deckAct(dir), 170);
    } else {
      card.style.transform = "";
      yes.style.opacity = no.style.opacity = 0;
    }
    dx = dy = 0;
  };
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);
}

let openId = null;
let draft  = null;   // previewed from search/charts, deliberately NOT in the library yet

/** The entry the sheet is showing — a library entry, or an uncommitted preview. */
function current() {
  return find(openId) || (draft && draft.id === openId ? draft : null);
}
function isDraft() {
  return !!draft && draft.id === openId && !find(openId);
}
/** Any edit inside a preview sheet is what actually adds it to the library. */
function commitDraft() {
  if (!isDraft()) return false;
  DB.entries.push(draft);
  const title = draft.title;
  draft = null;
  save();
  toast(t("已加入书架 · {0}", title));
  return true;
}

/** Regular seasons only — S0 specials never count toward "看完". */
function regularSeasons(e) {
  return (e.seasonsMeta || []).filter(s => s.n > 0 && s.count > 0);
}

function allRegularWatched(e) {
  const reg = regularSeasons(e);
  return reg.length > 0 && reg.every(s => (e.progress[s.n] || []).length >= s.count);
}

function seasonsBlock(e) {
  if (e.mediaType !== "tv" || !e.seasonsMeta || !e.seasonsMeta.length) return "";
  const tot = totalEps(e), w = watchedEps(e);

  return `
  <div class="blk">
    <div class="sec-title">${t("分季进度")}${tot ? ` · ${w}/${tot} ${t("集")} (${Math.round(w / tot * 100)}%)` : ""}</div>
    ${e.seasonsMeta.filter(s => s.count > 0).map(s => {
      const seen = (e.progress[s.n] || []).length;
      const pct  = s.count ? seen / s.count : 0;
      return `
      <details class="season" data-season="${s.n}">
        <summary>
          <span class="caret">▶</span>
          <span class="sname">${esc(s.name || (s.n === 0 ? t("特别篇") : t("第 {0} 季", s.n)))}</span>
          <span class="bar"><i style="width:${(pct * 100).toFixed(0)}%"></i></span>
          <span class="scount">${seen}/${s.count}</span>
        </summary>
        <div class="eps" data-eps="${s.n}">
          <div class="tiny faint" style="padding:10px 4px">${t("展开加载剧集…")}</div>
        </div>
      </details>`;
    }).join("")}
  </div>`;
}

function overviewBlock(e) {
  const x = extras.get(extrasKey(e));
  const text = x && x.overview;
  const tags = (e.genres && e.genres.length)
    ? `<div class="genres">${e.genres.map(g => `<span>${esc(g)}</span>`).join("")}</div>` : "";
  if (!text && !tags) return "";
  return `<div class="blk">${text ? `<p class="ov">${esc(text)}</p>` : ""}${tags}</div>`;
}

function castBlock(e) {
  const x = extras.get(extrasKey(e));
  const cast = x && x.cast;
  if (!cast || !cast.length) return "";
  return `
  <div class="blk">
    <div class="sec-title">${t("主要演员")}</div>
    <div class="people">
      ${cast.map(p => `
        <button class="person" data-cast="${p.id}" data-castname="${esc(p.name)}"
                data-castphoto="${esc(p.photo || "")}" title="${esc(p.name)}">
          ${IMG(p.photo, "w185")
            ? `<img class="av" src="${IMG(p.photo, "w185")}" alt="" loading="lazy">`
            : `<span class="av ph2">🎭</span>`}
          <span class="n">${esc(p.name)}</span>
          ${p.character ? `<span class="r">${esc(p.character)}</span>` : ""}
        </button>`).join("")}
    </div>
  </div>`;
}

function sheetHTML(e) {

      <div style="min-width:0;padding-bottom:4px">
        <h2>${esc(e.title)}</h2>
        ${e.originalTitle && e.originalTitle !== e.title
          ? `<div class="tiny faint" style="margin-bottom:6px">${esc(e.originalTitle)}</div>` : ""}
        <div class="sub">${sub.map((s, i) => `<span${i ? ' class="dot-sep"' : ""}>${s}</span>`).join("")}</div>

      <div class="sec-title">${t("我的记录")}</div>
      ${isDraft() ? `<div class="tiny" style="margin:-4px 0 13px;padding:9px 13px;border-radius:10px;
        background:var(--accent-soft);border:1px solid var(--accent);color:var(--dim)">
        ${t("还没加入书架 —— 选一个状态（或收藏、勾选剧集）即可加入")}
      </div>` : ""}
      <div class="row" style="margin-bottom:16px">
        ${STATUS_ORDER.map(k =>
          // nothing is pre-selected while previewing — the default "plan" would read
          // as a choice the user never made
          `<button class="chip" data-status="${k}" aria-pressed="${!isDraft() && e.status === k}">${t(STATUS[k].label)}</button>`).join("")}
        <button class="chip" data-fav aria-pressed="${e.favorite}">${t(e.favorite ? "★ 已收藏" : "☆ 收藏")}</button>

        <div>
          <label class="lb" for="dStart">${t("开始日期")}</label>

        </div>
        <div>
          <label class="lb" for="dRew">${t("重看次数")}</label>
          <input class="field" type="number" id="dRew" min="0" max="99" value="${e.rewatch || 0}">
        </div>
      </div>

      <div>
        <label class="lb" for="dNotes">${t("短评 / 笔记")}</label>
